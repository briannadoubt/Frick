name: frick-production

services:
  otel-collector:
    image: ${FRICK_OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.119.0}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../local/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${FRICK_OTEL_GRPC_BIND:-127.0.0.1:4317}:4317"
      - "${FRICK_OTEL_HTTP_BIND:-127.0.0.1:4318}:4318"

  redpanda:
    image: ${FRICK_REDPANDA_IMAGE:-docker.redpanda.com/redpandadata/redpanda:v24.3.7}
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "${FRICK_KAFKA_BIND:-127.0.0.1:19092}:19092"
      - "${FRICK_REDPANDA_ADMIN_BIND:-127.0.0.1:19644}:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 24

  frick-server:
    image: ${FRICK_SERVER_IMAGE:-frick-server:latest}
    depends_on:
      redpanda:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      FRICK_ENV: production
      FRICK_HOST: 0.0.0.0
      FRICK_PORT: 4099
      FRICK_DB_PATH: /var/lib/frick/frick.sqlite
      FRICK_ALLOWED_ORIGINS: ${FRICK_ALLOWED_ORIGINS:-}
      FRICK_ADMIN_TOKEN: ${FRICK_ADMIN_TOKEN:-}
      FRICK_PUBLIC_URL: ${FRICK_PUBLIC_URL:-}
      FRICK_PLATFORM_EVENTS_DRIVER: kafka
      FRICK_PLATFORM_EVENTS_KAFKA_BROKERS: redpanda:9092
      FRICK_PLATFORM_EVENTS_TOPIC: ${FRICK_PLATFORM_EVENTS_TOPIC:-frick.platform.events}
      FRICK_OTEL_ENABLED: "true"
      FRICK_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      FRICK_OTEL_SERVICE_NAME: frick-server
    ports:
      - "${FRICK_HTTP_BIND:-0.0.0.0:4099}:4099"
    volumes:
      - frick-data:/var/lib/frick
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4099/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  frick-data:
