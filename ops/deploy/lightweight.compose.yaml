name: frick-lightweight

services:
  frick-server:
    image: ${FRICK_SERVER_IMAGE:-frick-server:latest}
    environment:
      FRICK_ENV: production
      FRICK_HOST: 0.0.0.0
      FRICK_PORT: 4099
      FRICK_DB_PATH: /var/lib/frick/frick.sqlite
      FRICK_ALLOWED_ORIGINS: ${FRICK_ALLOWED_ORIGINS:-}
      FRICK_ADMIN_TOKEN: ${FRICK_ADMIN_TOKEN:-}
      FRICK_PUBLIC_URL: ${FRICK_PUBLIC_URL:-}
      FRICK_PLATFORM_EVENTS_DRIVER: sqlite
      FRICK_OTEL_ENABLED: "false"
    ports:
      - "${FRICK_HTTP_BIND:-0.0.0.0:4099}:4099"
    volumes:
      - frick-data:/var/lib/frick
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4099/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  frick-data:
