name: Publish Swift Package

# Runs on the unified bare semver tag (e.g. `0.3.0`) — the whole stack ships one
# version, so the same tag also fires the npm + Android publishes. Mirrors
# packages/swift (with history) to the standalone briannadoubt/FrickSwift repo so
# it can be consumed as a remote SwiftPM dependency. SwiftPM can't resolve a
# package nested in a subdirectory, so the mirror repo's root IS the package.
# The monorepo stays the single source of truth; the mirror is publish-only
# OUTPUT — never develop in or clone it; edit packages/swift here.
#
# One-time setup: add an SSH **deploy key** with write access on
# briannadoubt/FrickSwift, and store its PRIVATE key as the repo secret
# `SWIFT_MIRROR_DEPLOY_KEY`. Deploy keys never expire and need no account
# scopes (unlike a PAT). Without it the publish step cannot push to the mirror.
#
# To cut a release: `pnpm release:bump <version>`, land the `chore(release):`
# commit, and let release-autotag push the bare tag. The mirror is tagged with
# that same bare version.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: publish-swift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Mirror packages/swift to FrickSwift
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          # Don't persist the built-in GITHUB_TOKEN as a github.com credential
          # header — the mirror push authenticates with the SSH deploy key set
          # up below, not the HTTPS token.
          persist-credentials: false

      - name: Verify Swift release tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if ! [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a bare <semver> release tag, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --prune --unshallow origin +refs/heads/main:refs/remotes/origin/main
          else
            git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} must point at a commit on origin/main" >&2
            exit 1
          fi

      - name: Build package (gate)
        shell: bash
        run: |
          set -euo pipefail
          cd packages/swift
          swift build

      - name: Set up mirror deploy key
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.SWIFT_MIRROR_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_KEY}" ]]; then
            echo "SWIFT_MIRROR_DEPLOY_KEY is not set. Add an SSH deploy key with" >&2
            echo "write access on briannadoubt/FrickSwift and store its PRIVATE" >&2
            echo "key as the SWIFT_MIRROR_DEPLOY_KEY repo secret." >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/frick_mirror
          chmod 600 ~/.ssh/frick_mirror
          ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/frick_mirror -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Publish mirror
        shell: bash
        env:
          FRICK_SWIFT_MIRROR: git@github.com:briannadoubt/FrickSwift.git
        run: |
          set -euo pipefail
          scripts/publish-swift.sh "${GITHUB_REF_NAME}"
