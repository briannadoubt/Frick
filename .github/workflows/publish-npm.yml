name: Publish npm Packages

# Runs on `framework-vX.Y.Z` tag pushes after the release commit lands on
# main. npm trusted publishing must be configured per package for this exact
# workflow file in npm before the first release.
on:
  push:
    tags:
      - 'framework-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm with provenance
    if: ${{ startsWith(github.ref, 'refs/tags/framework-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3

      - name: Verify npm release tag
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const refName = process.env.GITHUB_REF_NAME ?? "";
          const semverPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|[\dA-Za-z-]*[A-Za-z-][\dA-Za-z-]*)(?:\.(?:0|[1-9]\d*|[\dA-Za-z-]*[A-Za-z-][\dA-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;
          if (!refName.startsWith("framework-v") || !semverPattern.test(refName.slice("framework-v".length))) {
            throw new Error(`Expected framework-v<semver> tag, got ${refName}`);
          }
          NODE
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --prune --unshallow origin +refs/heads/main:refs/remotes/origin/main
          else
            git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} must point at a commit on origin/main" >&2
            exit 1
          fi

      - name: Install pnpm
        # No `version:` here — it reads the pinned `packageManager` (pnpm@10.0.0)
        # from package.json. Supplying a value alongside packageManager trips
        # ERR_PNPM_BAD_PM_VERSION ("Multiple versions of pnpm specified").
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # pnpm/action-setup@v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify npm supports trusted publishing
        run: |
          npm --version
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";

          const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major, minor, patch] = version.split(".").map(Number);
          const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          if (!ok) {
            throw new Error(`npm ${version} does not support trusted publishing; need >= 11.5.1`);
          }
          NODE

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Generated artifacts in sync
        run: pnpm verify:generated

      - name: Release dry-run
        run: pnpm release:dry-run

      - name: Verify publish manifests request provenance
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: "true"
          EXPECTED_REPOSITORY_URL: "git+https://github.com/${{ github.repository }}.git"
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const packageDirs = [
            "packages/protocol",
            "packages/core",
            "packages/design",
            "packages/react",
            "packages/design-web",
            "packages/devtools",
            "packages/agent-kit",
            "packages/mcp",
            "apps/server",
          ];

          for (const dir of packageDirs) {
            const manifest = JSON.parse(readFileSync(`${dir}/package.json`, "utf8"));
            const expectedRepository = {
              type: "git",
              url: process.env.EXPECTED_REPOSITORY_URL,
              directory: dir,
            };
            if (manifest.private === true) {
              throw new Error(`${manifest.name} is unexpectedly private in npm publish list`);
            }
            if (manifest.publishConfig?.access !== "public") {
              throw new Error(`${manifest.name} must publish with public access`);
            }
            if (manifest.publishConfig.provenance !== true) {
              throw new Error(`${manifest.name} publishConfig.provenance must be true`);
            }
            if (
              manifest.repository?.type !== expectedRepository.type ||
              manifest.repository?.url !== expectedRepository.url ||
              manifest.repository?.directory !== expectedRepository.directory
            ) {
              throw new Error(`${manifest.name} repository metadata must equal ${JSON.stringify(expectedRepository)}`);
            }
          }
          NODE

      - name: Publish missing package versions
        shell: bash
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          set -euo pipefail
          package_dirs=(
            packages/protocol
            packages/core
            packages/design
            packages/react
            packages/design-web
            packages/devtools
            packages/agent-kit
            packages/mcp
            apps/server
          )

          for package_dir in "${package_dirs[@]}"; do
            name="$(node -p "JSON.parse(require('fs').readFileSync('${package_dir}/package.json', 'utf8')).name")"
            version="$(node -p "JSON.parse(require('fs').readFileSync('${package_dir}/package.json', 'utf8')).version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published; skipping"
              continue
            fi

            echo "Packing ${name}@${version}"
            pack_dir="$(mktemp -d)"
            pack_json="$(pnpm --dir "${package_dir}" pack --pack-destination "${pack_dir}" --json)"
            # node -e (not a heredoc): this runs inside the for-loop, and an
            # indented `<<'NODE'` terminator is not recognized at column 0, so a
            # heredoc here fails with "unexpected EOF" on bash 5.x.
            tarball="$(PACK_JSON="${pack_json}" node -e 'const parsed = JSON.parse(process.env.PACK_JSON ?? "[]"); const entry = Array.isArray(parsed) ? parsed[0] : parsed; if (!entry?.filename) { throw new Error("pnpm pack did not return a tarball filename"); } process.stdout.write(entry.filename);')"

            echo "Publishing ${name}@${version}"
            npm publish "${tarball}" --provenance --access public
          done
