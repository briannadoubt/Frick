name: CI

on:
  pull_request:
  push:
    branches: [main]
  # FR-100 — manual dispatch can opt into the non-blocking perf-budget step.
  # Left off the PR/push triggers on purpose: shared CI runners are too noisy
  # for a meaningful latency/throughput gate, so the budget run is opt-in.
  workflow_dispatch:
    inputs:
      run_perf_budget:
        description: "Run the FR-100 performance-budget check (non-blocking, trend only)"
        type: boolean
        default: false

# Cancel superseded runs on the same ref. Lets PRs reuse runner capacity
# instead of queueing every push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts:
    name: TypeScript (test, typecheck, generated artifacts, release dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # pnpm/action-setup@v6.0.8
        # action-setup v4 rejects supplying `version` here when
        # `packageManager` is set in package.json; let the action read
        # the version from there (currently pnpm@10.0.0).

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with:
          # node:sqlite shipped stably in Node 24; the workspace requires it.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Generated artifacts in sync
        run: pnpm verify:generated

      - name: Release dry-run (pack hygiene)
        run: pnpm release:dry-run

      - name: End-to-end smoke
        run: pnpm e2e:smoke

      # FR-100 — performance budgets + trend tracking. Opt-in and non-blocking:
      # only runs on a manual dispatch with `run_perf_budget=true`, and never
      # fails the job (`continue-on-error` + `--no-fail`). Shared CI runners are
      # noisy, so treat this as a trend signal, not a gate. The verdict JSON +
      # NDJSON history are uploaded as an artifact; promote it to a blocking gate
      # once the thresholds are tuned against accumulated history.
      - name: Performance budget (opt-in, non-blocking)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_perf_budget }}
        continue-on-error: true
        run: pnpm bench:budget --no-fail --history bench/.perf-history.ndjson --pretty | tee perf-budget-verdict.json

      - name: Upload perf-budget verdict
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_perf_budget }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: perf-budget-verdict
          path: |
            perf-budget-verdict.json
            bench/.perf-history.ndjson
          if-no-files-found: ignore

  ts-postgres:
    name: TypeScript (Postgres migration runner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Exercises the Postgres schema + migration runner (FR-22) against a real
    # Postgres instead of skipping the live suite. Scoped to the pg-migrations
    # file only — porting the per-store implementations onto Postgres (so the
    # full @fricken/server suite can run here) is FR-23; widen the command then.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # pnpm/action-setup@v6.0.8
        # Version read from `packageManager` in package.json.

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Postgres migration suite
        run: pnpm test:pg
        env:
          FRICK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/frick_test

  swift:
    name: Swift (FrickSwift + FrickDesign)
    runs-on: macos-15
    timeout-minutes: 15
    # Swift tests only re-run when something they depend on changes. The
    # paths list intentionally over-includes (e.g. all of protocol/) to
    # keep the rules simple at the cost of an extra macOS run now and then.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # pnpm/action-setup@v6.0.8
        # Version read from `packageManager` in package.json.

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Swift test (generates schema first)
        run: pnpm swift:test

  android:
    name: Android (frick + compose + design)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # pnpm/action-setup@v6.0.8
        # Version read from `packageManager` in package.json.

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # android-actions/setup-android@v4.0.1

      - name: Gradle cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # actions/cache@v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate schema and design artifacts
        run: pnpm schema:generate && pnpm design:generate

      - name: Android tests, lint, debug assemble
        working-directory: apps/android
        run: |
          # :app is the chat-shaped demo app from before the framework
          # boundary cleanup. It still imports removed SDK surface
          # (FrickDraftStore, UserDto, fetchInbox, etc.) and needs to be
          # gutted into a non-chat demo before we re-enable it in CI.
          # Tracked separately so this job stays green for framework
          # contributors who don't touch the demo.
          ./gradlew \
            :frick:testDebugUnitTest :frick:lintDebug :frick:assembleDebug \
            :frick-compose:lintDebug :frick-compose:assembleDebug \
            :design:testDebugUnitTest :design:lintDebug :design:assembleDebug
