name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref. Lets PRs reuse runner capacity
# instead of queueing every push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts:
    name: TypeScript (test, typecheck, generated artifacts, release dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup@v4
        # action-setup v4 rejects supplying `version` here when
        # `packageManager` is set in package.json; let the action read
        # the version from there (currently pnpm@10.0.0).

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          # node:sqlite shipped stably in Node 24; the workspace requires it.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Generated artifacts in sync
        run: pnpm verify:generated

      - name: Release dry-run (pack hygiene)
        run: pnpm release:dry-run

      - name: End-to-end smoke
        run: pnpm e2e:smoke

  ts-postgres:
    name: TypeScript (Postgres migration runner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Exercises the Postgres schema + migration runner (FR-22) against a real
    # Postgres instead of skipping the live suite. Scoped to the pg-migrations
    # file only — porting the per-store implementations onto Postgres (so the
    # full @frick/server suite can run here) is FR-23; widen the command then.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup@v4
        # Version read from `packageManager` in package.json.

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Postgres migration suite
        run: pnpm test:pg
        env:
          FRICK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/frick_test

  swift:
    name: Swift (FrickSwift + FrickDesign)
    runs-on: macos-15
    timeout-minutes: 15
    # Swift tests only re-run when something they depend on changes. The
    # paths list intentionally over-includes (e.g. all of protocol/) to
    # keep the rules simple at the cost of an extra macOS run now and then.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup@v4
        # Version read from `packageManager` in package.json.

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Swift test (generates schema first)
        run: pnpm swift:test

  android:
    name: Android (frick + compose + design + app)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup@v4
        # Version read from `packageManager` in package.json.

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # android-actions/setup-android@v3

      - name: Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate schema and design artifacts
        run: pnpm schema:generate && pnpm design:generate

      - name: Android tests, lint, debug assemble
        working-directory: apps/android
        run: |
          # :app is the chat-shaped demo app from before the framework
          # boundary cleanup. It still imports removed SDK surface
          # (FrickDraftStore, UserDto, fetchInbox, etc.) and needs to be
          # gutted into a non-chat demo before we re-enable it in CI.
          # Tracked separately so this job stays green for framework
          # contributors who don't touch the demo.
          ./gradlew \
            :frick:testDebugUnitTest :frick:lintDebug :frick:assembleDebug \
            :frick-compose:lintDebug :frick-compose:assembleDebug \
            :design:testDebugUnitTest :design:lintDebug :design:assembleDebug
