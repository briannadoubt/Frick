name: Publish Android SDK

# Runs on the unified bare semver tag (e.g. `0.3.0`) — the whole stack ships
# one version, so the same tag also fires the npm + Swift publishes. The Maven
# publication's `version` is read from the gradle file (`frickVersion`), which
# must equal the tag. To cut a release: `pnpm release:bump <version>`, commit,
# and let release-autotag push the tag (or push it by hand).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3

      - name: Verify Android release tag
        shell: bash
        run: |
          set -euo pipefail
          frickVersion="$(sed -nE 's/^[[:space:]]*val[[:space:]]+frickVersion[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' apps/android/frick/build.gradle.kts)"
          if [[ -z "${frickVersion}" ]]; then
            echo "Could not read frickVersion from apps/android/frick/build.gradle.kts" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "${frickVersion}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} != frickVersion ${frickVersion}; run 'pnpm release:bump ${GITHUB_REF_NAME}' before tagging" >&2
            exit 1
          fi
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --prune --unshallow origin +refs/heads/main:refs/remotes/origin/main
          else
            git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} must point at a commit on origin/main" >&2
            exit 1
          fi

      - name: Install pnpm
        # No `version:` here — it reads the pinned `packageManager` (pnpm@10.0.0)
        # from package.json. Specifying a different value (e.g. `10`) trips
        # ERR_PNPM_BAD_PM_VERSION ("Multiple versions of pnpm specified").
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # pnpm/action-setup@v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # android-actions/setup-android@v4.0.1

      - name: Gradle cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # actions/cache@v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generated artifacts in sync
        run: pnpm verify:generated

      - name: Android tests, lint, debug assemble
        working-directory: apps/android
        # Build/lint only the published SDK modules. The demo `:app` is
        # intentionally excluded here to match ci.yml — it still imports
        # removed SDK surface and is known-broken until it is gutted, and it is
        # not part of the published artifact (only :frick is published), so it
        # must not gate the SDK release.
        run: |
          ./gradlew \
            :frick:testDebugUnitTest :frick:lintDebug :frick:assembleDebug \
            :frick-compose:lintDebug :frick-compose:assembleDebug \
            :design:testDebugUnitTest :design:lintDebug :design:assembleDebug \
            --no-daemon

      - name: Publish to GitHub Packages
        working-directory: apps/android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :frick:publishReleasePublicationToGitHubPackagesRepository --no-daemon
