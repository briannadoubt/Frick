name: Publish Android SDK

# Runs on `android-vX.Y.Z` tag pushes. The Maven publication's `version` is
# read from the gradle file (`frickVersion`); the tag triggers the publish
# but doesn't override the coordinate. To cut a release: bump `frickVersion`
# in `apps/android/frick/build.gradle.kts`, commit, tag `android-vX.Y.Z`,
# push the tag.
on:
  # Called in-run by release.yml (the automatic path). Also fires on a
  # manually-pushed android-v* tag (by-hand fallback).
  workflow_call: {}
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    if: ${{ startsWith(github.ref, 'refs/tags/android-v') || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4

      - name: Verify Android release tag
        if: ${{ startsWith(github.ref, 'refs/tags/android-v') }}
        shell: bash
        run: |
          set -euo pipefail
          frickVersion="$(sed -nE 's/^[[:space:]]*val[[:space:]]+frickVersion[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' apps/android/frick/build.gradle.kts)"
          expected="android-v${frickVersion}"
          if [[ -z "${frickVersion}" ]]; then
            echo "Could not read frickVersion from apps/android/frick/build.gradle.kts" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Expected tag ${expected}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --prune --unshallow origin +refs/heads/main:refs/remotes/origin/main
          else
            git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} must point at a commit on origin/main" >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # android-actions/setup-android@v3

      - name: Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generated artifacts in sync
        run: pnpm verify:generated

      - name: Android tests, lint, debug assemble
        working-directory: apps/android
        run: |
          ./gradlew \
            :frick:testDebugUnitTest :frick:lintDebug :frick:assembleDebug \
            :frick-compose:lintDebug :frick-compose:assembleDebug \
            :design:testDebugUnitTest :design:lintDebug :design:assembleDebug \
            :app:lintDebug :app:assembleDebug \
            --no-daemon

      - name: Publish to GitHub Packages
        working-directory: apps/android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :frick:publishReleasePublicationToGitHubPackagesRepository --no-daemon
