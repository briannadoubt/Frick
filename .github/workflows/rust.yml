name: Rust

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3

      # GitHub runners ship rustup; the toolchain version comes from
      # rust-toolchain.toml so CI and local builds stay pinned together.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The push-adapter tests include_str! gitignored throwaway signing keys;
      # generate them on a fresh checkout (no-op locally where they exist).
      - name: Generate push test keys
        run: bash scripts/gen-test-keys.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  rust-postgres:
    name: Rust (Postgres integration, FR-242)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The frick-store Postgres backend tests (driver + migration runner)
      # only run when FRICK_DATABASE_URL points at a live database; they skip
      # cleanly otherwise. This job provides the postgres:16 service so they
      # exercise the real Postgres arm.
      - name: Postgres integration tests
        env:
          FRICK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/frick_test
        # Serial: every test resets + re-migrates the one shared database, so
        # they must not run concurrently (parallel DROP/CREATE race each other).
        run: cargo test -p frick-store --test postgres_live -- --test-threads=1
