name: Rust

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3

      # GitHub runners ship rustup; the toolchain version comes from
      # rust-toolchain.toml so CI and local builds stay pinned together.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  rust-postgres:
    name: Rust (Postgres integration, FR-242)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The frick-store Postgres backend tests (driver + migration runner)
      # only run when FRICK_DATABASE_URL points at a live database; they skip
      # cleanly otherwise. This job provides the postgres:16 service so they
      # exercise the real Postgres arm.
      - name: Postgres integration tests
        env:
          FRICK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/frick_test
        run: cargo test -p frick-store --test postgres_live

  conformance-cross-impl:
    name: Conformance (Rust suite vs the TypeScript server, FR-250)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # pnpm/action-setup@v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages

      # Boot the TypeScript server with the productTestSchema, then run the
      # language-neutral conformance suite against it. The Rust-server run of
      # the same suite is covered by the `rust` job's `cargo test --workspace`.
      - name: Conformance suite vs the TypeScript server
        run: |
          PORT=4399 pnpm tsx scripts/conformance-ts-server.ts &
          TS_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4399/ready >/dev/null 2>&1 && break
            sleep 1
          done
          FRICK_CONFORMANCE_URL=http://127.0.0.1:4399 cargo test -p frick-conformance
          STATUS=$?
          kill "$TS_PID" 2>/dev/null || true
          exit $STATUS
