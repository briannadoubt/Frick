name: Release (auto-tag)

# One-click release cutter. Reads the release version from the package
# manifests and creates + pushes the platform release tags
# (`framework-v*`, `swift-v*`, `android-v*`). Those tag pushes are what
# trigger the existing publish workflows:
#   framework-v*  -> publish-npm.yml      (npm trusted publishing)
#   swift-v*      -> publish-swift.yml    (FrickSwift mirror)
#   android-v*    -> publish-android.yml  (GitHub Packages)
#
# This keeps "stop before publish tags" honest: nothing publishes on merge.
# An operator runs this workflow from the Actions tab (or `gh workflow run`)
# when a release commit is on main, and CI does the rest — computing the
# version, validating lockstep, and creating every platform tag in one go.
#
# === REQUIRED ONE-TIME SETUP =================================================
# Tags MUST be pushed with a PAT, NOT the default GITHUB_TOKEN. GitHub
# deliberately suppresses workflow triggers for refs pushed by GITHUB_TOKEN,
# so the publish-*.yml workflows would NOT fire. Add a repository secret
# `RELEASE_TAG_TOKEN`:
#   - classic PAT with `repo` scope, or
#   - fine-grained PAT scoped to this repo with Contents: read & write.
# Without it the checkout/push below cannot create release tags that trigger
# downstream publishing.
# ============================================================================
#
# To make releases fully automatic on merge later, add a `push: branches:
# [main]` trigger and gate the job on the head commit message starting with
# `chore(release):`. Left manual on purpose for now.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no prefix). Blank = @fricken/protocol's package.json version."
        required: false
        default: ""
      npm:
        description: "Create framework-v<version> (npm publish)"
        type: boolean
        default: true
      swift:
        description: "Create swift-v<version> (Swift mirror)"
        type: boolean
        default: true
      android:
        description: "Create android-v<version> (Android SDK)"
        type: boolean
        default: true
      dry_run:
        description: "Log the tags that would be created without pushing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-autotag
  cancel-in-progress: false

jobs:
  tag:
    name: Create + push release tags
    # Only ever cut releases from main.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard against missing PAT
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG_TOKEN}" ]]; then
            echo "RELEASE_TAG_TOKEN is not set. Tags pushed with the default" >&2
            echo "GITHUB_TOKEN do NOT trigger the publish workflows. Add a PAT" >&2
            echo "secret named RELEASE_TAG_TOKEN (Contents: read & write)." >&2
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the PAT so pushed tags trigger publish-*.yml.
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - name: Resolve and validate version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION}"
          if [[ -z "${version}" ]]; then
            version="$(node -p "require('./packages/protocol/package.json').version")"
          fi
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "${version}" =~ ${semver} ]]; then
            echo "Not a valid semver release version: '${version}'" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version}"

      - name: Verify Android version is in lockstep
        if: ${{ inputs.android }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          frick="$(sed -nE 's/^[[:space:]]*val[[:space:]]+frickVersion[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' apps/android/frick/build.gradle.kts)"
          if [[ "${frick}" != "${VERSION}" ]]; then
            echo "android frickVersion (${frick}) != release version (${VERSION})." >&2
            echo "Bump apps/android/frick/build.gradle.kts before tagging android-v${VERSION}." >&2
            exit 1
          fi
          echo "android frickVersion matches: ${frick}"

      - name: Create + push tags
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DO_NPM: ${{ inputs.npm }}
          DO_SWIFT: ${{ inputs.swift }}
          DO_ANDROID: ${{ inputs.android }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          declare -a tags=()
          [[ "${DO_NPM}" == "true" ]] && tags+=("framework-v${VERSION}")
          [[ "${DO_SWIFT}" == "true" ]] && tags+=("swift-v${VERSION}")
          [[ "${DO_ANDROID}" == "true" ]] && tags+=("android-v${VERSION}")

          if [[ ${#tags[@]} -eq 0 ]]; then
            echo "No platforms selected; nothing to tag." >&2
            exit 1
          fi

          head="$(git rev-parse --short HEAD)"
          for tag in "${tags[@]}"; do
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "${tag} already exists locally; skipping"
              continue
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "${tag} already exists on origin; skipping"
              continue
            fi
            echo "Creating ${tag} at ${head}"
            git tag -a "${tag}" -m "Release ${tag}"
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "[dry-run] would push ${tag}"
              git tag -d "${tag}" >/dev/null
            else
              git push origin "refs/tags/${tag}"
              echo "Pushed ${tag} -> triggers its publish workflow"
            fi
          done
