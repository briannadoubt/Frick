name: Release (auto-tag)

# One-click release cutter. The whole stack ships as ONE version: every
# package + the Android SDK move together, and a single bare semver tag
# (e.g. `0.3.0`) triggers every publish workflow at once:
#   <version>  -> publish-npm.yml      (npm trusted publishing)
#              -> publish-swift.yml    (FrickSwift mirror)
#              -> publish-android.yml  (GitHub Packages)
#
# Fires automatically when a `chore(release):` commit lands on main, and can
# also be run manually from the Actions tab (or `gh workflow run`). Either way
# CI does the rest — computing the version, validating lockstep, and pushing
# the single release tag.
#
# === REQUIRED ONE-TIME SETUP =================================================
# Tags MUST be pushed with a PAT, NOT the default GITHUB_TOKEN. GitHub
# deliberately suppresses workflow triggers for refs pushed by GITHUB_TOKEN,
# so the publish-*.yml workflows would NOT fire. Add a repository secret
# `RELEASE_TAG_TOKEN`:
#   - classic PAT with `repo` scope, or
#   - fine-grained PAT scoped to this repo with Contents: read & write.
# Without it the checkout/push below cannot create release tags that trigger
# downstream publishing.
# ============================================================================

on:
  # Auto-fire when a release commit lands on main. The job is gated below on
  # the head commit message so only `chore(release):` commits cut tags.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (bare semver). Blank = @fricken/protocol's package.json version."
        required: false
        default: ""
      dry_run:
        description: "Log the tag that would be created without pushing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-autotag
  cancel-in-progress: false

jobs:
  tag:
    name: Create + push release tags
    # Only cut releases from main, and only for release commits on push.
    # workflow_dispatch always runs (operator chose to).
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
           startsWith(github.event.head_commit.message, 'chore(release):')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard against missing PAT
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG_TOKEN}" ]]; then
            echo "RELEASE_TAG_TOKEN is not set. Tags pushed with the default" >&2
            echo "GITHUB_TOKEN do NOT trigger the publish workflows. Add a PAT" >&2
            echo "secret named RELEASE_TAG_TOKEN (Contents: read & write)." >&2
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          # Use the PAT so pushed tags trigger publish-*.yml.
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - name: Resolve and validate version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION}"
          if [[ -z "${version}" ]]; then
            version="$(node -p "require('./packages/protocol/package.json').version")"
          fi
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "${version}" =~ ${semver} ]]; then
            echo "Not a valid semver release version: '${version}'" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version}"

      - name: Verify Android version is in lockstep
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          frick="$(sed -nE 's/^[[:space:]]*val[[:space:]]+frickVersion[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' apps/android/frick/build.gradle.kts)"
          if [[ "${frick}" != "${VERSION}" ]]; then
            echo "android frickVersion (${frick}) != release version (${VERSION})." >&2
            echo "All packages ship one version — run 'pnpm release:bump ${VERSION}' before tagging." >&2
            exit 1
          fi
          echo "android frickVersion matches: ${frick}"

      - name: Create + push the release tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          # workflow_dispatch may request a dry run; auto-fire on push never does.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One bare semver tag for the whole stack. It fans out to all three
          # publish workflows (npm / Swift mirror / Android) on push.
          tag="${VERSION}"
          head="$(git rev-parse --short HEAD)"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null \
            || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; nothing to do." >&2
            exit 0
          fi

          echo "Creating ${tag} at ${head}"
          git tag -a "${tag}" -m "Release ${tag}"
          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "[dry-run] would push ${tag}"
            git tag -d "${tag}" >/dev/null
          else
            git push origin "refs/tags/${tag}"
            echo "Pushed ${tag} -> triggers npm + Swift + Android publishes"
          fi
