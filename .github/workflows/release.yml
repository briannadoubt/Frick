name: Release

# Automatic, two-secret release pipeline. When a `chore(release): vX.Y.Z`
# commit lands on main (or you run this manually), it publishes every platform
# in ONE run by calling the publish workflows as reusable workflows, then
# pushes the marker tags (framework-v*, swift-v*, android-v*) for changelog
# history. Because publishing happens in this same run, nothing depends on
# tag-push events — so no tagging PAT is required.
#
# === ONE-TIME SETUP: add two repository secrets ============================
#   NPM_TOKEN           npm automation token with publish rights to @fricken/*
#   SWIFT_MIRROR_TOKEN  PAT with write access to briannadoubt/FrickSwift
# Android publishes with the built-in GITHUB_TOKEN (packages: write). That's it
# — no per-package npm config, no tagging PAT.
# ===========================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (semver, no prefix). Blank = @fricken/protocol's version."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release version
    # Auto path: only chore(release): commits. Manual path: always.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve + validate version (and Android lockstep)
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [[ -z "${version}" ]]; then
            version="$(node -p "require('./packages/protocol/package.json').version")"
          fi
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "${version}" =~ ${semver} ]]; then
            echo "Not a valid semver release version: '${version}'" >&2
            exit 1
          fi
          frick="$(sed -nE 's/^[[:space:]]*val[[:space:]]+frickVersion[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' apps/android/frick/build.gradle.kts)"
          if [[ "${frick}" != "${version}" ]]; then
            echo "android frickVersion (${frick}) != release version (${version})." >&2
            echo "Bump apps/android/frick/build.gradle.kts in the chore(release) commit." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}"

  npm:
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    secrets: inherit

  swift:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/publish-swift.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  android:
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-android.yml
    secrets: inherit

  tag:
    name: Push marker tags
    needs: [prepare, npm, swift, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create + push marker tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for prefix in framework-v swift-v android-v; do
            tag="${prefix}${VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "${tag} already exists on origin; skipping"
              continue
            fi
            git tag -a "${tag}" -m "Release ${tag}"
            # Pushed with GITHUB_TOKEN, which intentionally does NOT re-trigger
            # the publish workflows (publishing already happened above).
            git push origin "refs/tags/${tag}"
            echo "Pushed ${tag}"
          done
