# Example Compose file for the published-package server image.
#
# Default (SQLite, single container, persistent volume):
#   docker compose -f docker/published-server/compose.yaml up --build
#
# Postgres-backed (stateless server container):
#   docker compose -f docker/published-server/compose.yaml --profile postgres up --build
#
# This is a reference, not a production deployment. For the full self-hosted
# profile (Redpanda platform events + OTel collector) use the monorepo's
# `ops/deploy/compose.yaml` via `frick deploy`.
name: frick-published-server

services:
  frick-server:
    build:
      context: .
    image: ${FRICK_SERVER_IMAGE:-frick-published-server:latest}
    environment:
      FRICK_ENV: production
      FRICK_HOST: 0.0.0.0
      FRICK_PORT: 4099
      FRICK_DB_PATH: /var/lib/frick/frick.sqlite
      FRICK_BLOB_DRIVER: filesystem
      FRICK_BLOB_STORAGE_PATH: /var/lib/frick/blobs
      FRICK_ALLOWED_ORIGINS: ${FRICK_ALLOWED_ORIGINS:-}
      FRICK_ADMIN_TOKEN: ${FRICK_ADMIN_TOKEN:-}
      FRICK_PUBLIC_URL: ${FRICK_PUBLIC_URL:-}
    ports:
      - "${FRICK_HTTP_BIND:-0.0.0.0:4099}:4099"
    volumes:
      - frick-data:/var/lib/frick
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4099/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  # `--profile postgres` swaps the SQLite store for Postgres. The server
  # container then holds no durable state, so it can be scaled/replaced freely.
  postgres:
    profiles: ["postgres"]
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: frick
      POSTGRES_PASSWORD: ${FRICK_PG_PASSWORD:-frick}
      POSTGRES_DB: frick
    volumes:
      - frick-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frick -d frick"]
      interval: 5s
      timeout: 5s
      retries: 12

  frick-server-pg:
    profiles: ["postgres"]
    build:
      context: .
    image: ${FRICK_SERVER_IMAGE:-frick-published-server:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FRICK_ENV: production
      FRICK_HOST: 0.0.0.0
      FRICK_PORT: 4099
      FRICK_DB_DRIVER: postgres
      FRICK_DATABASE_URL: postgres://frick:${FRICK_PG_PASSWORD:-frick}@postgres:5432/frick
      FRICK_ALLOWED_ORIGINS: ${FRICK_ALLOWED_ORIGINS:-}
      FRICK_ADMIN_TOKEN: ${FRICK_ADMIN_TOKEN:-}
    ports:
      - "${FRICK_HTTP_BIND:-0.0.0.0:4099}:4099"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4099/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  frick-data:
  frick-pgdata:
