[package]
name = "frick-store"
description = "Frick storage layer: SqlDriver seam, framework migrations, and the durable/cache stores"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
# At-rest value encryption (AURA-328): the workspace's established pure-Rust
# AEAD (ChaCha20-Poly1305, already a workspace dependency for call E2EE) plus
# HKDF-SHA256 for per-tenant key derivation (same crate/version frick-server
# uses for Web Push content encryption). No native deps.
chacha20poly1305 = { workspace = true }
deadpool-postgres = { workspace = true }
frick-protocol = { workspace = true }
hex = { workspace = true }
hkdf = "0.12"
object_store = { workspace = true }
rand = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
rusqlite = { workspace = true }
scrypt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
