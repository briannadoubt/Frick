name: FrickDemo
options:
  bundleIdPrefix: dev.frick
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  FrickDesign:
    path: ../../packages/design-swift
  FrickSwift:
    path: ../../packages/swift
targets:
  FrickDemo:
    type: application
    platform: iOS
    supportedDestinations:
      - iOS
    sources:
      - FrickDemo
    dependencies:
      - package: FrickDesign
      - package: FrickSwift
      - sdk: AppIntents.framework
    info:
      path: FrickDemo/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.frick.demo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_INTENTS_METADATA_GENERATION: "NO"
schemes:
  FrickDemo:
    build:
      targets:
        FrickDemo: all
    run:
      config: Debug
    archive:
      config: Release
